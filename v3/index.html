<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ごみ出しカレンダー</title>
<meta http-equiv="refresh" content="2; url=../gomiappV3.0/">
<style>
  body{margin:0;font:16px/1.7 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;background:#f6f5f1;color:#1f2421}
  main{max-width:480px;margin:0 auto;padding:40px 16px;text-align:center}
  a{color:#2f8f5b;font-weight:700}
  @media (prefers-color-scheme: dark){body{background:#141715;color:#e9ece9} a{color:#4fb87d}}
</style>
</head>
<body>
<main>
  <p>ごみ出しカレンダーは、新しい場所に移りました。</p>
  <p><a href="../gomiappV3.0/">ごみ出しカレンダーを開く</a></p>
  <p style="font-size:13px">ホーム画面に追加している人は、新しい場所を開いてから、もう一度「ホーム画面に追加」してください。登録した地区はそのまま残ります。</p>
</main>
<script>
  // 前の版（初版・v2・v3）のオフライン用のしくみを止めてから、新しい場所へ移る
  (async () => {
    try {
      const regs = navigator.serviceWorker ? await navigator.serviceWorker.getRegistrations() : [];
      await Promise.all(regs.filter(r => !r.scope.includes("/gomiappV3.0/")).map(r => r.unregister()));
    } catch (e) {}
    location.replace("../gomiappV3.0/" + location.search + location.hash);
  })();
</script>
</body>
</html>
