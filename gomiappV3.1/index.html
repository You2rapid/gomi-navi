<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ごみ出しカレンダー</title>
<meta name="description" content="周南市・下松市・光市のごみ収集カレンダーと分別検索（非公式・身内用）">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- iPhone でホーム画面に追加したとき用 -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ごみ出し3.1">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141715" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#efede7; --line:#e1ded6;
  --text:#1f2421; --muted:#636a66; --accent:#2f8f5b; --accent-ink:#ffffff;
  --mark:#fff0a8; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);
  /* 区分カラー（市のごみ収集カレンダーと同じ色合い） */
  --c-kanen:#009a4c; --c-shie:#e4007f; --c-bin:#6f6aae; --c-pet:#9fd8f3;
  --c-yopura:#f5dc00; --c-tapura:#f7a21b; --c-funen:#00adef; --c-shokon:#2b2829;
  --c-sodai:#7c4dbb; --c-kogata:#4a55a8; --c-kaden:#4d5b66; --c-x:#3a3a3a; --c-ref:#8a8f8c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141715; --surface:#1d211f; --surface-2:#262b28; --line:#323834;
    --text:#e9ece9; --muted:#a1a9a4; --accent:#4fb87d; --accent-ink:#0d1a12;
    --mark:#5c4f12; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
    --c-kanen:#2fbf72; --c-shie:#f0479f; --c-bin:#9a95d6; --c-pet:#9fd8f3;
    --c-yopura:#f0d531; --c-tapura:#f6a83a; --c-funen:#35bdf2; --c-shokon:#bdb8b9;
    --c-sodai:#a17ad8; --c-kogata:#7d87d6; --c-kaden:#8a9aa6; --c-x:#9a9a9a; --c-ref:#7d837f;
  }
}
:root[data-theme="dark"]{
  --bg:#141715; --surface:#1d211f; --surface-2:#262b28; --line:#323834;
  --text:#e9ece9; --muted:#a1a9a4; --accent:#4fb87d; --accent-ink:#0d1a12;
  --mark:#5c4f12; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  --c-kanen:#2fbf72; --c-shie:#f0479f; --c-bin:#9a95d6; --c-pet:#9fd8f3;
  --c-yopura:#f0d531; --c-tapura:#f6a83a; --c-funen:#35bdf2; --c-shokon:#bdb8b9;
  --c-sodai:#a17ad8; --c-kogata:#7d87d6; --c-kaden:#8a9aa6; --c-x:#9a9a9a; --c-ref:#7d837f;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
  font-size:16px; line-height:1.6;
}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.brand svg{flex:none}
.brand h1{font-size:19px;margin:0;letter-spacing:.02em}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:normal;letter-spacing:0}
.tabs{display:flex;gap:4px;margin:0 0 10px;background:var(--surface-2);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:9px;font-size:14px;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--text);font-weight:700;box-shadow:var(--shadow)}

.search{position:relative;margin-bottom:10px}
.search input{
  width:100%;font:inherit;font-size:17px;padding:12px 44px 12px 44px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--text);outline:none;
}
.search input:focus{border-color:var(--accent)}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;width:36px;height:36px;border-radius:50%;cursor:pointer;color:var(--muted);display:none}
.search .clear.show{display:block}
.chips-wrap{position:relative;margin:0 -16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;cursor:grab;scroll-behavior:smooth}
.chips.dragging{cursor:grabbing;scroll-behavior:auto}
.chips.dragging .chip{pointer-events:none}
.chips::-webkit-scrollbar{height:6px}
.chips::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
@media (pointer:coarse){.chips{scrollbar-width:none}.chips::-webkit-scrollbar{display:none}}
.chip-nav{position:absolute;top:0;bottom:10px;width:48px;border:0;display:flex;align-items:center;cursor:pointer;z-index:2;font-size:18px;color:var(--text);padding:0 8px}
.chip-nav.prev{left:0;justify-content:flex-start;background:linear-gradient(to right,var(--bg) 45%,transparent)}
.chip-nav.next{right:0;justify-content:flex-end;background:linear-gradient(to left,var(--bg) 45%,transparent)}
.chip-nav span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 8px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--cc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.28)}
.chip[aria-pressed="true"]{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,var(--surface));font-weight:700}

/* list */
main{padding:12px 0 80px}
.status{font-size:13px;color:var(--muted);margin:0 0 8px}
.kana-bar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.kana-bar button{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:40px;padding:4px 0;cursor:pointer;font-size:15px}
.group-h{position:sticky;top:var(--hdr,170px);z-index:5;background:var(--bg);font-weight:700;color:var(--muted);font-size:13px;padding:8px 2px 4px;margin:0}
ul.items{list-style:none;margin:0 0 6px;padding:0;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
ul.items li + li{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:11px 14px;cursor:pointer}
.item:hover{background:var(--surface-2)}
.item .txt{flex:1;min-width:0}
.item .nm{font-weight:600;line-height:1.45}
/* 説明書きは途中で切らずに、折り返して全部表示する */
.item .nt{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:2px;overflow-wrap:anywhere}
.item mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.flag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px;border:1px solid currentColor}
.flag.new{color:var(--c-shokon)} .flag.chg{color:var(--c-funen)}
.badge{flex:none;color:#fff;background:var(--cc);border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:700;white-space:nowrap;min-width:5.6em;text-align:center}
.badge.ink-d,.tag.ink-d{color:#1a1a1a}
.badge.ink-o,.tag.ink-o{box-shadow:inset 0 0 0 1.5px #333}   /* 白い札（市のカレンダーが白地に黒いふちのもの） */
:root[data-theme="dark"] .badge,:root[data-theme="dark"] .tag{color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge,:root:not([data-theme="light"]) .tag{color:#111}}
.empty{background:var(--surface);border-radius:14px;padding:22px 18px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}
.empty b{color:var(--text)}

/* guide */
.cat-card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);margin:0 0 14px;overflow:hidden;border-top:6px solid var(--cc)}
.cat-card .hd{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.cat-card h2{font-size:18px;margin:0;flex:1}
.cat-card .bag{font-size:12.5px;font-weight:700;border-radius:8px;padding:3px 9px;background:color-mix(in srgb,var(--cc) 15%,var(--surface));color:var(--text);border:1px solid color-mix(in srgb,var(--cc) 45%,transparent)}
.cat-card .bd{padding:4px 16px 14px}
.cat-card h3{font-size:13.5px;color:var(--muted);margin:12px 0 4px}
.cat-card ul{margin:0;padding-left:1.2em}
.cat-card li{margin:2px 0}
.cat-card p{margin:4px 0}
.cat-card .more{border:0;background:transparent;color:var(--accent);font-weight:700;padding:6px 0 0;cursor:pointer}
.note-box{background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:14px;margin-top:8px}
.rules{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:6px 18px 16px;margin-bottom:14px}
.rules h2{font-size:17px;margin:14px 0 6px}
.rules ol,.rules ul{padding-left:1.3em;margin:4px 0}
.rules li{margin:4px 0}
.small{font-size:12.5px;color:var(--muted)}
a{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:760px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;max-height:86vh;overflow:auto;transform:translateY(105%);transition:transform .22s ease;padding:0 0 calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.sheet .sh-top{display:flex;align-items:flex-start;gap:10px;padding:10px 18px 0}
.sheet .sh-top h2{flex:1;font-size:19px;margin:6px 0 0;line-height:1.4}
.sheet .x{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;cursor:pointer;flex:none;font-size:18px}
.sheet .verdict{margin:12px 18px 0;border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--cc) 14%,var(--surface));border:1.5px solid color-mix(in srgb,var(--cc) 50%,transparent)}
.sheet .verdict .lbl{font-size:12px;color:var(--muted)}
.sheet .verdict .cat{font-size:21px;font-weight:800;color:var(--text)}
.sheet .verdict .bag{font-size:13.5px;margin-top:2px}
.sheet .sec{padding:0 18px}
.sheet .sec h3{font-size:13.5px;color:var(--muted);margin:14px 0 4px}
.sheet .sec ul{margin:0;padding-left:1.2em}
.sheet .sec li{margin:2px 0}
.sheet .btn{display:block;width:calc(100% - 36px);margin:16px 18px 0;border:0;border-radius:12px;padding:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}

/* ===== 収集日カレンダー ===== */
.tag{display:inline-flex;align-items:center;justify-content:center;background:var(--cc);color:#fff;font-weight:800;border-radius:6px;line-height:1.2;white-space:nowrap}
.area-bar{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px 10px 14px;margin:0 0 12px}
.area-bar .pin{flex:none;color:var(--accent)}
.area-bar .nm{flex:1;min-width:0;font-weight:700;line-height:1.35}
.area-bar .nm small{display:block;font-weight:normal;font-size:12px;color:var(--muted)}
.btn-sub{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:13.5px;font-weight:700;cursor:pointer}
.btn-sub:hover{border-color:var(--accent)}

.day-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
@media (max-width:680px){.day-cards{grid-template-columns:1fr}}
.day-card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px 14px;border:2px solid transparent;cursor:pointer;text-align:left;width:100%;display:flex;flex-direction:column;justify-content:flex-start}
.day-card.today{border-color:var(--accent)}
.day-card .when{display:flex;align-items:baseline;gap:6px;margin:0 0 8px}
.day-card .when b{font-size:20px}
.day-card .when span{color:var(--muted);font-size:14px}
.day-card .when em{margin-left:auto;font-style:normal;font-size:12px;color:var(--muted)}
.day-card .when em .late{color:#d32f2f;font-weight:800;font-size:13px}
:root[data-theme="dark"] .day-card .when em .late{color:#ff6b63}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .day-card .when em .late{color:#ff6b63}}
.day-card .big{display:flex;flex-direction:column;gap:6px}
.day-card .big .tag{justify-content:flex-start;font-size:19px;padding:9px 12px;border-radius:10px;gap:8px}
.day-card .big .tag small{font-size:12px;font-weight:700;opacity:.85;margin-left:auto}
.day-card .none{color:var(--muted);font-size:16px;padding:8px 2px}
.moved{font-size:11px;font-weight:800;border-radius:4px;padding:1px 5px;background:var(--text);color:var(--bg);margin-left:4px;letter-spacing:.02em}
/* 「きょう 11/30（月）」と「朝8時30分までに出す」は、途中で折り返さない。
   入りきらないときは「◯時まで」を次の行（右寄せ）に送る（下松市は文字が長いため） */
.day-card .when{flex-wrap:wrap;row-gap:2px}
.day-card .when b,.day-card .when span,.day-card .when em{white-space:nowrap}
/* ごみの名前と袋の色が1行に入らないときは、袋の色を次の行（右寄せ）へ */
.day-card .big .tag{flex-wrap:wrap;row-gap:2px}
.day-card .big .tag .tn{white-space:nowrap}
.day-card .note{font-size:12.5px;color:var(--muted);margin:8px 0 0}

.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;margin:0 0 12px}
.card h2{font-size:15px;margin:0 0 8px}
.next-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
@media (max-width:520px){.next-list{grid-template-columns:1fr}}
.next-list li{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.next-list .tag{font-size:12px;padding:3px 0;width:5.2em;flex:none}
.next-list .dt{flex:1;font-weight:700}
.next-list .rule{display:block;font-size:11.5px;color:var(--muted);font-weight:normal}
.next-list .in{flex:none;font-size:13px;color:var(--muted)}
.next-list .in.soon{color:var(--accent);font-weight:800}

.month-hd{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.month-hd h2{flex:1;text-align:center;margin:0;font-size:18px}
.month-hd button{border:1.5px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:18px}
.month-hd button:disabled{opacity:.3;cursor:default}
.month-hd .to-today{width:auto;border-radius:999px;padding:0 12px;font-size:13px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .wd{font-size:12px;font-weight:700;text-align:center;color:var(--muted);padding:2px 0}
.cal .wd.sun,.cal .d.sun .n,.cal .d.hol .n{color:#d6403a}
.cal .wd.sat,.cal .d.sat .n{color:#2f6fc4}
.cal .d{min-height:66px;border-radius:8px;background:var(--surface-2);padding:3px 2px 4px;display:flex;flex-direction:column;align-items:stretch;gap:2px;border:2px solid transparent;cursor:pointer;text-align:left;font:inherit;color:inherit}
.cal .d.blank{background:transparent;cursor:default}
.cal .d.past{opacity:.45}
.cal .d.is-today{border-color:var(--accent);background:var(--surface)}
.cal .d .n{font-size:13px;font-weight:700;padding-left:3px;line-height:1.3}
.cal .d .tag{font-size:10.5px;padding:2px 0;border-radius:4px;letter-spacing:-.02em}
.cal .d .mv{font-size:9px;font-weight:800;text-align:center;color:var(--muted);line-height:1}
@media (min-width:600px){.cal .d{min-height:78px}.cal .d .tag{font-size:12px}}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--cc);display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.28)}

/* 地区えらび */
.picker h2{font-size:17px;margin:4px 0 4px}
.picker p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.seg{display:flex;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;margin:0 0 10px}
.seg button{flex:1;border:0;background:transparent;padding:7px 2px;border-radius:9px;font-size:14px;cursor:pointer;color:var(--muted)}
.seg.many{flex-wrap:wrap}
.seg.many button{flex:1 0 22%}
.pick-sel{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);margin:0 0 10px}
.area-list li.area-sub{padding:8px 14px 4px;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:700;box-shadow:var(--shadow)}
.picker input{width:100%;font:inherit;font-size:16px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);outline:none;margin:0 0 10px}
.picker input:focus{border-color:var(--accent)}
.area-list{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;max-height:52vh;overflow-y:auto}
.area-list li + li{border-top:1px solid var(--line)}
.area-list button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:11px 14px;cursor:pointer;font-size:15px}
.area-list button:hover{background:var(--surface-2)}
.area-list .s{margin-left:auto;flex:none;font-size:12.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.picker .alt{margin:14px 0 0;font-size:13.5px}
.picker .alt summary{cursor:pointer;color:var(--accent);font-weight:700}
.sched-grid{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.sched-grid button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:700}

/* 地区の切り替え・管理 */
.area-switch{margin:-4px 0 12px;overflow-x:auto}
.area-switch button{flex:1 0 auto;line-height:1.3;padding:6px 10px;white-space:nowrap}
.area-switch button small{display:block;font-size:11px;font-weight:normal}
.area-list.mine{max-height:none}
.area-list.mine li{display:flex;align-items:stretch}
.area-list.mine li > button:first-child{flex:1;min-width:0}
.area-list .cur{width:1.2em;flex:none;color:var(--accent);font-weight:800}
.area-list .del{flex:none;width:48px;justify-content:center;color:var(--muted);border-left:1px solid var(--line) !important}

/* お知らせ（年末年始・祝日） */
.notice{display:flex;gap:10px;background:color-mix(in srgb,#e53935 9%,var(--surface));border:1.5px solid color-mix(in srgb,#e53935 45%,transparent);border-radius:14px;padding:10px 14px;margin:0 0 12px}
.notice .ic{flex:none;width:22px;height:22px;border-radius:50%;background:#e53935;color:#fff;font-weight:900;display:grid;place-items:center;font-size:14px;margin-top:2px}
.notice .ttl{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.notice p{margin:2px 0;font-size:14.5px}

/* 品目検索の「次に出せる日」 */
.bcol{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}

<!-- 自治体の一覧と祝日。自治体ごとのデータ（data/<県>/<自治体>/city.js・items.js・calendar.js）は、えらんだ自治体の分だけあとから読む -->

window.GOMI_DATA = {};
function gomiData(code, kind, data){ (window.GOMI_DATA[code] = window.GOMI_DATA[code] || {})[kind] = data; }

<script>
// ストアのアプリ：前に公開ページから取ってきた新しい自治体の一覧・祝日があれば、アプリに入っているものの代わりに使う
try {
  if (window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform())
    ["data/municipalities.js", "data/holidays.js"].forEach(p => { const s = localStorage.getItem("gomi31-data:" + p); if (s) (0, eval)(s); });
} catch(e){}

<script>
"use strict";
/* ===== 動いている場所 =====
   NATIVE：ストアのアプリ（Capacitor で包んだもの）。それ以外はブラウザ版（PWA）。 */
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
/* ===== データの読み先 =====
   ブラウザ版：このアプリと同じ場所から読む（一度読んだものは Service Worker がオフライン用に保存）。
   ストアのアプリ：まず公開ページ（REMOTE）から新しいデータを読み、このスマホに保存する。電波がなければ保存したもの、
   それもなければアプリに入っているものを使う。こうすると、毎年4月の収集日の更新は、ストアの審査なしで公開ページを直すだけで届く。
   公開ページのデータの形を変えるときは、前に出したアプリでも読めるように気をつける。 */
const REMOTE = "https://you2rapid.github.io/gomi-navi/gomiappV3.1/";
const DATA_CACHE = "gomi31-data:";
function fetchText(u, ms){
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), ms);
  return fetch(u, {signal: ctl.signal, cache: "no-cache"}).then(r => { clearTimeout(tm); if (!r.ok) throw new Error(u); return r.text(); });
}
async function dataText(path){
  if (NATIVE){
    try { const s = await fetchText(REMOTE + path, 6000); try { localStorage.setItem(DATA_CACHE + path, s); } catch(e){} return s; } catch(e){}
    try { const s = localStorage.getItem(DATA_CACHE + path); if (s) return s; } catch(e){}
  }
  return fetchText(path, 20000);
}
// data/ の .js を読む（ブラウザ版は <script>、ストアのアプリは上の順で取ってきた中身を動かす）
function loadData(path){
  if (!NATIVE) return loadScript(path);
  return dataText(path).then(s => { const el = document.createElement("script"); el.text = s; document.head.appendChild(el); });
}
// 50音の行（品目一覧の見出し）
const KANA_ROWS = [["あ","アイウエオ"],["か","カキクケコ"],["さ","サシスセソ"],["た","タチツテト"],["な","ナニヌネノ"],["は","ハヒフヘホ"],["ま","マミムメモ"],["や","ヤユヨ"],["ら","ラリルレロ"],["わ","ワヲン"]];

// いま表示している市の区分・品目（useCity で切り替える）
let CATS = {}, ORDER = [], ITEMS = [], DARK_INK = new Set(), OUTLINE = new Set();

/* ===== 検索用の正規化（カタカナ→ひらがな、全角→半角、空白除去） ===== */
function normChar(ch){
  let s = ch.normalize("NFKC").toLowerCase();
  let out = "";
  for (const c of s){
    const code = c.charCodeAt(0);
    if (code >= 0x30A1 && code <= 0x30F6) out += String.fromCharCode(code - 0x60);
    else if (/[\s・･、,。]/.test(c)) continue;
    else out += c;
  }
  return out;
}
function normalize(str){
  // map[i] = 正規化後 i 文字目が元の文字列の何文字目か
  let s = "", map = [];
  const chars = Array.from(str);
  let pos = 0;
  for (const ch of chars){
    const n = normChar(ch);
    for (let j = 0; j < n.length; j++){ s += n[j]; map.push(pos); }
    pos += ch.length;
  }
  map.push(pos);
  return {s, map};
}
// 検索用の下ごしらえ（市ごとに1回だけ）
function prepItems(src){ return src.map((x, i) => { const it = {...x, id:i};
  it._n = normalize(it.n);
  it._d = it.d ? normChar(it.d) : "";
  it._y = it.y ? normChar(it.y) : "";
  it._base = normChar(it.n.split(/[（(]/)[0]);
  it._parts = (it.n + "・" + (it.y || "")).split(/[・･（）()、]/).map(p => normChar(p)).filter(Boolean);
  return it; }); }

/* ===== 状態 ===== */
const state = {q:"", cat:null, tab:"search"};
const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cssVar = c => `var(${(CATS[c]||CATS["―"]).color})`;

// 明るい色の区分は黒い文字にする
const ink = c => (DARK_INK.has(c) ? " ink-d" : "") + (OUTLINE.has(c) ? " ink-o" : "");
function badge(c){
  const label = {"×":"市で収集しない","―":"参照"}[c] || CATS[c].name.replace(/（.*?）/,"");
  return `<span class="badge${ink(c)}" style="--cc:${cssVar(c)}">${esc(label)}</span>`;
}
function highlight(it, qn){
  if (!qn) return esc(it.n);
  const idx = it._n.s.indexOf(qn);
  if (idx < 0) return esc(it.n);
  const a = it._n.map[idx], b = it._n.map[idx + qn.length];
  return esc(it.n.slice(0,a)) + "<mark>" + esc(it.n.slice(a,b)) + "</mark>" + esc(it.n.slice(b));
}
function itemRow(it, qn){
  const flags = (it.new ? `<span class="flag new">新規掲載</span>` : "") + (it.chg ? `<span class="flag chg">区分変更</span>` : "");
  return `<li><button class="item" data-id="${it.id}">
    <span class="txt"><span class="nm">${highlight(it, qn)}${flags}</span>${it.d ? `<span class="nt" style="display:block">${esc(it.d)}</span>` : ""}</span>
    <span class="bcol">${badge(it.c)}${nextLabel(it.c)}</span></button></li>`;
}
// 品目一覧の「次 11/25（水）」表示（同じ区分は1回だけ計算）
let nextMemo = {};
function nextLabel(c){
  if (!(c in nextMemo)){
    const d = typeof nextFor === "function" ? nextFor(c) : null;
    nextMemo[c] = d ? `<span class="nx">次 ${md(d)}</span>` : "";
  }
  return nextMemo[c];
}

/* ===== 検索 ===== */
function search(){
  const qn = normChar(state.q);
  let list = ITEMS.filter(it => !state.cat || it.c === state.cat);
  if (qn){
    const scored = [];
    for (const it of list){
      let sc = -1;
      if (it._base === qn || it._parts.includes(qn)) sc = 0;
      else if (it._n.s.startsWith(qn) || it._y.startsWith(qn)) sc = 1;
      else if (it._parts.some(p => p.startsWith(qn))) sc = 2;
      else if (it._n.s.includes(qn) || it._y.includes(qn)) sc = 3;
      else if (it._d.includes(qn)) sc = 4;
      if (sc >= 0) scored.push([sc, it]);
    }
    scored.sort((a,b) => a[0]-b[0] || a[1]._n.s.length - b[1]._n.s.length);
    list = scored.map(x => x[1]);
  }
  return {qn, list};
}

function render(){
  nextMemo = {};
  const {qn, list} = search();
  const res = $("#results"), st = $("#status"), kb = $("#kanaBar");
  $("#clear").classList.toggle("show", !!state.q);
  const catLabel = state.cat ? `「${CATS[state.cat].name}」の` : "";
  if (qn){
    kb.hidden = true;
    st.textContent = `${catLabel}「${state.q}」の検索結果：${list.length}件`;
    if (!list.length && state.cat){
      res.innerHTML = `<div class="empty"><b>「${esc(CATS[state.cat].name)}」の中には見つかりませんでした</b><br>
        <button class="more" data-allcats style="border:0;background:transparent;color:var(--accent);font-weight:700;cursor:pointer;padding:8px 0 0">すべての区分で「${esc(state.q)}」を探す →</button></div>`;
      return;
    }
    if (!list.length){
      res.innerHTML = `<div class="empty"><b>見つかりませんでした</b><br>ひらがな・カタカナ・別の呼び方（例：「傘」→「かさ」）でも試してみてください。<br>迷ったときは「分別区分」タブの説明や、${esc(CITY.contact)}へ。</div>`;
      return;
    }
    let html = "";
    const named = list.filter(it => it._n.s.includes(qn) || it._y.includes(qn) || it._parts.some(p=>p.startsWith(qn)));
    const noted = list.filter(it => !named.includes(it));
    if (named.length) html += `<ul class="items">${named.map(it => itemRow(it, qn)).join("")}</ul>`;
    if (noted.length) html += `<p class="group-h" style="position:static">備考に「${esc(state.q)}」を含む品目</p><ul class="items">${noted.map(it => itemRow(it, "")).join("")}</ul>`;
    res.innerHTML = html;
    return;
  }
  // 一覧（五十音）
  kb.hidden = false;
  st.textContent = `${catLabel}品目一覧：${list.length}件（五十音順）`;
  const groups = KANA_ROWS.map(([h, ks]) => [h, list.filter(it => ks.includes(it.k))]).filter(g => g[1].length);
  kb.innerHTML = KANA_ROWS.map(([h]) => {
    const has = groups.some(g => g[0] === h);
    return `<button data-jump="${h}" ${has ? "" : "disabled style='opacity:.35'"}>${h}</button>`;
  }).join("");
  res.innerHTML = groups.map(([h, its]) => {
    its = its.slice().sort((a,b) => kanaIdx(a.k) - kanaIdx(b.k) || 0);
    return `<h2 class="group-h" id="g-${h}">${h}行</h2><ul class="items">${its.map(it => itemRow(it, "")).join("")}</ul>`;
  }).join("") || `<div class="empty">該当する品目がありません</div>`;
}
const KANA_SEQ = KANA_ROWS.map(r => r[1]).join("");
const kanaIdx = k => KANA_SEQ.indexOf(k);

/* ===== チップ ===== */
function renderChips(){
  const counts = {};
  ITEMS.forEach(it => counts[it.c] = (counts[it.c]||0) + 1);
  $("#chips").innerHTML = `<button class="chip" data-cat="" aria-pressed="${!state.cat}" style="--cc:var(--accent)"><span class="dot"></span>すべて</button>` +
    ORDER.map(c => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${state.cat===c}" style="--cc:${cssVar(c)}"><span class="dot"></span>${esc(CATS[c].name.replace(/（.*?）/,""))}</button>`).join("");
  const sel = $("#chips .chip[aria-pressed='true']");
  if (sel){
    const box = $("#chips");
    // 選択中の区分が見えるようにスクロール（矢印ボタンに隠れない位置へ）
    if (sel.offsetLeft < box.scrollLeft + 48 || sel.offsetLeft + sel.offsetWidth > box.scrollLeft + box.clientWidth - 48)
      box.scrollLeft = sel.offsetLeft - 56;

/* 区分チップの横スクロール：矢印ボタン・マウスホイール・ドラッグ */
function updateChipNav(){
  const box = $("#chips");
  $("#chipPrev").hidden = box.scrollLeft <= 4;
  $("#chipNext").hidden = box.scrollLeft + box.clientWidth >= box.scrollWidth - 4;
}
(function(){
  const box = $("#chips");
  const step = () => Math.max(160, box.clientWidth * 0.7);
  $("#chipPrev").addEventListener("click", () => box.scrollBy({left: -step()}));
  $("#chipNext").addEventListener("click", () => box.scrollBy({left: step()}));
  box.addEventListener("scroll", updateChipNav, {passive:true});
  window.addEventListener("resize", updateChipNav);
  box.addEventListener("wheel", e => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && box.scrollWidth > box.clientWidth){
      e.preventDefault();
      box.scrollBy({left: e.deltaY, behavior: "auto"});
    }
  }, {passive:false});
  let startX = 0, startLeft = 0, down = false, moved = false;
  box.addEventListener("pointerdown", e => {
    if (e.pointerType !== "mouse" || e.button !== 0) return;
    down = true; moved = false; startX = e.clientX; startLeft = box.scrollLeft;
  });
  window.addEventListener("pointermove", e => {
    if (!down) return;
    const dx = e.clientX - startX;
    if (!moved && Math.abs(dx) > 5){ moved = true; box.classList.add("dragging"); }
    if (moved) box.scrollLeft = startLeft - dx;
  });
  window.addEventListener("pointerup", () => {
    if (!down) return;
    down = false;
    // ドラッグ直後のクリックで区分が切り替わらないようにする
    if (moved) setTimeout(() => box.classList.remove("dragging"), 0);
  });
})();

      ${inRange(today) && (y !== today.getFullYear() || mo !== today.getMonth()) ? `<button class="to-today" data-mon="0">今月</button>` : ""}
      <button data-mon="1" ${canNext ? "" : "disabled"} aria-label="次の月">›</button></div>
    <div class="cal">` + [...WDJ].map((w, i) => `<div class="wd${i === 0 ? " sun" : i === 6 ? " sat" : ""}">${w}</div>`).join("");
  for (let i = 0; i < first.getDay(); i++) html += `<div class="d blank"></div>`;
  for (let day = 1; day <= ndays; day++){
    const d = new Date(y, mo, day), k = ymd(d);
    const cats = catsOn(d), mv = movedOn(d);
    const cls = ["d", d.getDay() === 0 ? "sun" : d.getDay() === 6 ? "sat" : "", HOLIDAYS.has(k) ? "hol" : "", d < today ? "past" : "", +d === +today ? "is-today" : ""].filter(Boolean).join(" ");
    const label = `${mo+1}月${day}日 ${cats.length ? cats.map(c => LONG[c]).join("、") : "収集なし"}`;
    html += `<button class="${cls}" data-day="${k}" aria-label="${esc(label)}"><span class="n">${day}</span>${cats.map(c => tag(c)).join("")}${mv.length ? `<span class="mv">振替</span>` : ""}${NATIVE && hasDay(k) ? `<span class="bell" aria-label="通知あり">🔔</span>` : ""}</button>`;
  }
  html += `</div><div class="legend">` + CAL_ORDER.filter(c => sched().rules[c]).map(c => `<span><i style="--cc:${cssVar(c)}"></i>${esc(SHORT[c])}＝${esc(LONG[c])}</span>`).join("") + `</div>
    <p class="small" style="margin:10px 0 0">日付をタップすると、出せるごみの詳しい出し方が見られます。${Object.keys(sched().moved).length ? "祝日などで収集日が移った日には「振替」と表示しています。" : ""}</p></div>`;
  if (!inRange(today)) html += `<div class="empty">このアプリには${nendo(CAL)}（${CAL.year}年4月〜${CAL.year + 1}年3月）の収集日が入っています。新しい年度のカレンダーが出たら更新してください。</div>`;
  v.innerHTML = html;
  updateBadge();
}

// 地区が多い市は、検索欄を出す（地区名・よみ・説明と、towns.js の町名で探す）

const areaHint = cy => cy.hint || (cy.towns.length ? "地区名・町名で探す（例：" + cy.towns[0][0] + "）" : "地区名で探す");

// 市をえらび直したとき（地区がまだ1つもなければ、品目検索などもその市にする）
function pickCity(id){

    loadCity(id).then(() => pickCity(id), () => alert("データを読み込めませんでした。電波のよい所で、もう一度お試しください。"));

/* ===== 今いる場所から探す（GPS） =====
   位置情報はスマホの中だけで使い、外には送らない。
   町の境目データ（geo/towns.json：e-Stat 国勢調査の町丁・字等別境界データを加工）と照らし合わせて、
   周南市・光市は町名から地区の候補を、下松市は市の地図の境目の線から西地区・東地区を出す。 */
const geo = {index:null, files:{}, cities:{}};
const GEO_BORDER_M = 400;   // 境目の線で地区を分ける自治体（下松市）：線からこれより近いときは「境目の近く」とする
const fetchJson = u => NATIVE ? dataText(u).then(JSON.parse) : fetch(u).then(r => { if (!r.ok) throw new Error(u); return r.json(); });
// geo/index.json に県ごとの範囲があるので、現在地をふくむ県の地図（geo/<県>.json）だけを読む
async function loadGeo(lon, lat){
  if (!geo.index) geo.index = await fetchJson("geo/index.json");
  const m = .05;
  for (const p of geo.index.prefs){
    if (lon < p.bbox[0] - m || lon > p.bbox[2] + m || lat < p.bbox[1] - m || lat > p.bbox[3] + m || geo.files[p.file]) continue;
    const d = await fetchJson("geo/" + p.file);
    prepGeo(d); geo.files[p.file] = d; Object.assign(geo.cities, d.cities);
  }
}
// 10万分の1度の整数・差分で入っている座標を、経度・緯度に戻す
function prepGeo(d){
  const [bx, by] = d.base;
  for (const cy of Object.values(d.cities)) for (const t of cy.towns){
    t.rings = t.p.map(a => { const out = []; let x = 0, y = 0;
      for (let i = 0; i < a.length; i += 2){ x += a[i]; y += a[i + 1]; out.push([bx + x / 1e5, by + y / 1e5]); }
      return out; });
    t.bb = [bx + t.b[0] / 1e5, by + t.b[1] / 1e5, bx + t.b[2] / 1e5, by + t.b[3] / 1e5];
    delete t.p;
  }
}
// 経度・緯度の差をメートルにする（この辺りの狭い範囲なので平面で計算）
const toM = (lon, lat, lat0) => [lon * Math.cos(lat0 * Math.PI / 180) * 111320, lat * 110540];
function segInfo(p, a, b){
  const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy;
  const k = L ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L)) : 0;
  return {d: Math.hypot(p[0] - a[0] - k * dx, p[1] - a[1] - k * dy), cross: dx * (p[1] - a[1]) - dy * (p[0] - a[0])};
}
function inTown(t, lon, lat){
  if (lon < t.bb[0] || lon > t.bb[2] || lat < t.bb[1] || lat > t.bb[3]) return false;
  let inside = false;
  for (const r of t.rings) for (let i = 0, j = r.length - 1; i < r.length; j = i++){
    const [xi, yi] = r[i], [xj, yj] = r[j];
    if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
// どの市のどの町にいるか。海沿いなどで少し外れたときは 300m 以内のいちばん近い町
function locate(lon, lat){
  const cities = geo.cities;
  for (const [id, cy] of Object.entries(cities)) for (const t of cy.towns) if (inTown(t, lon, lat)) return {city:id, town:t, near:false};
  const p = toM(lon, lat, lat);
  let best = null;
  for (const [id, cy] of Object.entries(cities)) for (const t of cy.towns){
    if (lon < t.bb[0] - .005 || lon > t.bb[2] + .005 || lat < t.bb[1] - .005 || lat > t.bb[3] + .005) continue;
    for (const r of t.rings) for (let i = 1; i < r.length; i++){
      const d = segInfo(p, toM(r[i - 1][0], r[i - 1][1], lat), toM(r[i][0], r[i][1], lat)).d;
      if (!best || d < best.d) best = {city:id, town:t, d};
    }
  }
  return best && best.d <= 300 ? {city:best.city, town:best.town, near:true} : null;
}
// 境目の線で地区を分ける自治体（今は使っていない。前は下松市）：線の向きの左側が sides[0]、右側が sides[1]
function lineSide(lon, lat, town, gc){
  if (town.side) return {side:town.side, d:Infinity};
  const L = gc.line, p = toM(lon, lat, lat);
  let best = null;
  for (let i = 1; i < L.length; i++){
    const s = segInfo(p, toM(L[i - 1][0], L[i - 1][1], lat), toM(L[i][0], L[i][1], lat));
    if (!best || s.d < best.d) best = s;
  }
  return {side: best.cross > 0 ? gc.sides[0] : gc.sides[1], d: best.d};
}
function getPosition(){
  // 動作確認用：URL に ?geo=34.0553,131.8071 のように付けると、その場所にいることにする
  const m = location.search.match(/geo=([\d.]+),([\d.]+)/);
  if (m) return Promise.resolve({lat:+m[1], lon:+m[2], acc:10});
  return new Promise((ok, ng) => {
    if (!navigator.geolocation) { ng({code:"none"}); return; }
    navigator.geolocation.getCurrentPosition(
      p => ok({lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy}), ng,
      {enableHighAccuracy:true, timeout:20000, maximumAge:60000});
  });
}
async function findByGps(){
  calState.geo = {st:"wait"}; renderGeoBox();
  try {
    const pos = await getPosition();
    await loadGeo(pos.lon, pos.lat).catch(() => { throw {code:"data"}; });
    const hit = locate(pos.lon, pos.lat);
    if (!hit){ calState.geo = {st:"out"}; }
    else {
      await loadCity(hit.city).catch(() => { throw {code:"data"}; });
      const t = hit.town, gc = geo.cities[hit.city], g = {st:"ok", city:hit.city, name:t.n.replace(/^大字/, ""), near:hit.near, rough:pos.acc > 150};
      if (gc.line){
        const s = lineSide(pos.lon, pos.lat, t, gc);
        g.sides = gc.sides; g.side = s.side; g.border = s.d < GEO_BORDER_M + Math.min(pos.acc, 500);
      } else {
        g.cands = t.c; g.region = t.r;
      }
      calState.geo = g;
      calState.city = hit.city; calState.q = "";
      calState.region = g.region || CITIES[hit.city].regions[0] || "";
      if (!calState.area) useCity(hit.city);
    }
  } catch(e){
    const code = e && e.code;
    calState.geo = {st:"err", msg:
      code === 1 ? "位置情報の利用が許可されていません。スマホの設定で、ブラウザ（Safari や Chrome）に位置情報の利用を許可してから、もう一度お試しください。"
      : code === "none" ? "このブラウザでは現在地を使えません。下の一覧からえらんでください。"
      : code === "data" ? "地図のデータを読み込めませんでした。電波のよい所で、もう一度お試しください。"
      : "現在地が分かりませんでした。屋外や窓の近くで、もう一度お試しください。"};
  }
  renderPicker();
}
function geoBoxHtml(){
  const g = calState.geo;
  if (!g) return "";
  if (g.st === "wait") return `<p class="geo-wait"><span class="spin"></span>現在地を調べています…</p>`;
  if (g.st === "err") return `<div class="note-box geo-res">${esc(g.msg)}</div>`;
  if (g.st === "out"){
    const names = MUNIS.length <= 6 ? MUNIS.map(m => m.name).join("・") : "";
    return `<div class="note-box geo-res">${names ? `${esc(names)}の外にいるようです。このアプリで使えるのは${esc(names)}だけです。` : "このアプリで使える市町村の外にいるようです。"}下の一覧からえらんでください。</div>`;
  }
  const cy = CITIES[g.city], areas = cy.cal.areas;
  const head = `<p class="geo-hd">📍 <b>${esc(cy.name)} ${esc(g.name)}</b> ${g.near ? "の近く" : "のあたり"}にいるようです</p>
    ${g.rough ? `<p class="small">現在地の誤差が大きいので、ずれているかもしれません。</p>` : ""}`;
  const row = (i, mark) => `<li><button data-area="${i}"><span class="nm2">${mark ? `<span class="city-badge geo-mark">${mark}</span>` : ""}${esc(areas[i].n)}${areas[i].d ? `<span class="desc">${esc(areas[i].d)}</span>` : ""}</span>${(cy.schedLabel(areas[i].s) || areas[i].n) !== areas[i].n ? `<span class="s">${esc(cy.schedLabel(areas[i].s))}</span>` : ""}</button></li>`;
  if (g.sides){
    const order = areas.map((a, i) => i).sort((a, b) => (areas[b].s === g.side) - (areas[a].s === g.side));
    return `<div class="geo-res">${head}
      <p>${g.border ? `${esc(g.sides[0])}と${esc(g.sides[1])}の<b>境目の近く</b>です。市のごみカレンダーの地図で確かめてからえらんでください。` : `現在地は <b>${esc(g.side)}</b> のようです。合っていればタップしてください。`}</p>
      <ul class="area-list">${order.map(i => row(i, !g.border && areas[i].s === g.side ? "現在地" : "")).join("")}</ul></div>`;
  }
  return `<div class="geo-res">${head}
    ${g.cands.length ? `<p>当てはまる地区をタップしてください。</p><ul class="area-list">${g.cands.map(i => row(i, "")).join("")}</ul>
      <p class="small">見つからないときは、下の一覧${cy.regionName(g.region) ? `（${esc(cy.regionName(g.region))}）` : ""}から探してください。</p>`
    : `<p>この辺りの地区は、下の一覧${cy.regionName(g.region) ? `（${esc(cy.regionName(g.region))}）` : ""}から探してください。</p>`}</div>`;
}
function renderGeoBox(){ const b = $("#geoBox"); if (b) b.innerHTML = geoBoxHtml(); }

// 地区をえらんだとき：登録済みならそこへ切り替え、なければ追加して表示
function setArea(a){
  const item = {c:calState.city, r:a.r || "", n:a.n, s:a.s};
  let i = calState.areas.findIndex(x => x.c === item.c && x.n === item.n && x.s === item.s);
  if (i < 0){
    if (calState.areas.length >= MAX_AREAS){ alert(`登録できるのは${MAX_AREAS}か所までです。使わない地区を ✕ で削除してください。`); return; }
    calState.areas.push(item); i = calState.areas.length - 1;
  }
  switchArea(i);
}
function switchArea(i){
  calState.cur = i; saveAreas();
  calState.picking = false; calState.q = ""; calState.city = calState.area.c; calState.month = null; calState.geo = null;
  renderCal(); render(); window.scrollTo({top:0});
}
function removeArea(i){
  const a = calState.areas[i];
  if (!confirm(`「${a.n}」を登録から外しますか？`)) return;
  calState.areas.splice(i, 1);
  if (calState.cur >= i && calState.cur > 0) calState.cur--;
  saveAreas();
  if (calState.area) calState.city = calState.area.c;
  renderCal(); render();
}

// focus：長押しで開いたとき（通知のボタンのところを見せる）
function openDay(k, focus){
  state.day = k;
  const d = new Date(+k.slice(0,4), +k.slice(5,7)-1, +k.slice(8,10));
  const cats = catsOn(d), mv = movedOn(d);
  const sh = $("#sheet");
  sh.innerHTML = `<div class="grab"></div>
    <div class="sh-top"><h2 id="shTitle">${d.getFullYear()}年${md(d)}${HOLIDAYS.has(k) ? `<span class="small">　祝日・休日</span>` : ""}</h2><button class="x" data-close aria-label="閉じる">✕</button></div>
    ${cats.length ? `<div class="sec"><p class="small" style="margin:6px 0 0">${esc(calState.area.n)}（${esc(areaSub(calState.area))}）／${cutText()}までに決められた場所へ</p></div>`
      + cats.map(c => {
        const cc = CATS[c];
        return `<div class="verdict" style="--cc:${cssVar(c)}"><div class="cat">${esc(cc.name)}${mv.includes(c) ? `<span class="moved">振替</span>` : ""}</div>
          <div class="bag">出し方：${esc(cc.bag)}</div></div>
          <div class="sec">${list(cc.how)}<button class="more" data-filter="${esc(c)}" style="border:0;background:transparent;color:var(--accent);font-weight:700;cursor:pointer;padding:4px 0">この区分の品目を見る →</button></div>`;
      }).join("")
      : `<div class="sec"><div class="note-box" style="margin-top:12px">この日は収集がありません。</div></div>`}
    ${quickHtml(k)}`;
  $("#scrim").classList.add("open"); sh.classList.add("open");
  sh.scrollTop = 0;
  if (focus){
    const q = $("#nfQuick");
    q.classList.add("hl");
    setTimeout(() => { sh.scrollTop = Math.max(0, q.offsetTop - 60); }, 230);
  }
}

// 日にちの長押し（0.5秒）：通知のボタンのところを開く。指が動いたら（スクロール）やめる
const press = {tm:null, x:0, y:0, fired:false};
$("#view-cal").addEventListener("pointerdown", e => {
  const day = e.target.closest("[data-day]");
  press.fired = false; clearTimeout(press.tm);
  if (!day || !calState.area) return;
  press.x = e.clientX; press.y = e.clientY;
  press.tm = setTimeout(() => { press.fired = true; if (navigator.vibrate) navigator.vibrate(15); openDay(day.dataset.day, true); }, 500);
});
$("#view-cal").addEventListener("pointermove", e => { if (Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) clearTimeout(press.tm); });
["pointerup", "pointercancel", "pointerleave"].forEach(ev => $("#view-cal").addEventListener(ev, () => clearTimeout(press.tm)));
$("#view-cal").addEventListener("contextmenu", e => { if (e.target.closest("[data-day]")) e.preventDefault(); });
$("#view-cal").addEventListener("click", e => {
  const day = e.target.closest("[data-day]");
  if (day){ if (press.fired){ press.fired = false; return; } if (calState.area) openDay(day.dataset.day); return; }
  const mon = e.target.closest("[data-mon]");
  if (mon){
    const n = +mon.dataset.mon, m = calState.month;
    if (n === 0){ const t = now(); calState.month = new Date(t.getFullYear(), t.getMonth(), 1); }
    else calState.month = new Date(m.getFullYear(), m.getMonth() + n, 1);
    renderCal(); return;
  }
  if (e.target.closest("[data-pick]")){
    calState.picking = true; calState.city = calState.area ? calState.area.c : calState.city;
    calState.region = (calState.area && calState.area.r) || CITIES[calState.city].regions[0] || "";
    renderCal(); window.scrollTo({top:0}); return;
  }
  const ct = e.target.closest("[data-city]");
  if (ct){ pickCity(ct.dataset.city); return; }
  const pf = e.target.closest("[data-pref]");
  if (pf){ calState.cq = ""; pickCity(sortedMunis(pf.dataset.pref)[0].code); return; }
  if (e.target.closest("[data-pick-cancel]")){ calState.picking = false; calState.geo = null; renderCal(); window.scrollTo({top:0}); return; }
  if (e.target.closest("[data-geo]")){ findByGps(); return; }
  if (e.target.closest("[data-notify]")){ openNotify(); return; }
  const sw = e.target.closest("[data-switch]");
  if (sw){ switchArea(+sw.dataset.switch); return; }
  const rm = e.target.closest("[data-remove]");
  if (rm){ removeArea(+rm.dataset.remove); return; }
  const r = e.target.closest("[data-region]");
  if (r){ calState.region = r.dataset.region; calState.q = ""; renderPicker(); return; }
  const ar = e.target.closest("[data-area]");
  if (ar){ setArea(CITIES[calState.city].cal.areas[+ar.dataset.area]); return; }
  const sc = e.target.closest("[data-sched]");
  if (sc){ setArea({r:"", n:CITIES[calState.city].schedLabel(sc.dataset.sched), s:sc.dataset.sched}); return; }
});

/* ===== 通知（3.1） =====
   シンプルにする：カレンダーの日にちを長押し（タップでも）して「🔔 この日を知らせる」を押すと、その日だけ1回知らせる。
   知らせる時刻は、通知の設定のスライドバー1本で決める（前の日の夕方4時〜当日の出す時刻の30分前。どの日も同じ時刻）。
   ・ストアのアプリ（Capacitor で包んだもの。NATIVE）… スマホの中で通知を予約する（ローカル通知。サーバーはいらない）
   ・ブラウザ版 … その日の予定を、通知つきでスマホのカレンダーに入れるファイル（.ics）を作る
   ほかに、アプリを開いたときの「あしたは○○の日です」と、ホーム画面のアイコンの数字の印（ブラウザ版の対応するスマホだけ）。
   設定はこのスマホの中（localStorage の gomi31-notify）にだけ保存する。外には送らない。 */
const LN = NATIVE ? (window.Capacitor.Plugins || {}).LocalNotifications : null;
const NOTIFY_KEY = "gomi31-notify";
// time：収集日の0時から何分前（−）か何分後（＋）か（-300 = 前の日の夜7時）
// days：知らせる日の一覧 [{a: 地区（areaKey）, k: 日付}]（ストアのアプリだけ）
const notify = {time:-300, days:[], remind:true, badge:false};
try { Object.assign(notify, JSON.parse(localStorage.getItem(NOTIFY_KEY) || "{}")); } catch(e){}
if (typeof notify.time !== "number") notify.time = -300;
if (!Array.isArray(notify.days)) notify.days = [];
function saveNotify(){ try { localStorage.setItem(NOTIFY_KEY, JSON.stringify({time:notify.time, days:notify.days, remind:notify.remind, badge:notify.badge})); } catch(e){} }
const areaKey = a => `${a.c}:${a.s}:${a.n}`;
const canBadge = !NATIVE && "setAppBadge" in navigator;
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

// ---- 時刻 ----
const cutOfArea = a => { const cy = CITIES[a.c]; return (cy.cal.schedules[a.s] && cy.cal.schedules[a.s].cut) || cy.cut; };
// 例：19:00 → 夜7時、6:30 → 朝6時半
function clock(min){
  const h = Math.floor(min / 60), m = min % 60;
  const word = h < 11 ? "朝" : h < 16 ? "昼" : h < 18 ? "夕方" : "夜";
  return `${word}${h > 12 ? h - 12 : h}時${m === 30 ? "半" : m ? m + "分" : ""}`;
}
const timeLabel = m => m < 0 ? "前の日の" + clock(m + 1440) : "当日の" + clock(m);
// スライドバーの目盛り（30分きざみ）：前の日の夕方4時〜夜11時半、当日の朝5時〜出す時刻の30分前
function timeSteps(a){
  const c = a && CITIES[a.c] ? cutOfArea(a) : [8, 0], last = c[0] * 60 + c[1] - 30, out = [];
  for (let m = 16 * 60; m <= 23 * 60 + 30; m += 30) out.push(m - 1440);
  for (let m = 5 * 60; m <= last; m += 30) out.push(m);
  return out;
}
// 地区 a の収集日 k に知らせる日時（当日の朝は、その地区の出す時刻より前になるようにする）
function notifyAt(a, k){
  const c = cutOfArea(a), lim = c[0] * 60 + c[1] - 30;
  const m = notify.time >= 0 ? Math.min(notify.time, lim) : notify.time;
  return new Date(+k.slice(0,4), +k.slice(5,7)-1, +k.slice(8,10), 0, m);
}
const atLabel = d => `${md(d)} ${clock(d.getHours() * 60 + d.getMinutes())}`;

// ---- アプリを開いたときのお知らせ・アイコンの印 ----
const notifyCats = k => (sched().days[k] || []).slice().sort((x, y) => CAL_ORDER.indexOf(x) - CAL_ORDER.indexOf(y));
// きょう（出す時刻の前）か、あしたに出すごみ
function soonCats(){
  if (!CAL || !calState.area || calState.area.c !== CITY_ID) return null;
  const td = today0(), tm = addDays(td, 1);
  if (inRange(td) && !isLate(now())){ const cs = notifyCats(ymd(td)); if (cs.length) return {when:"きょう", cs}; }
  if (inRange(tm)){ const cs = notifyCats(ymd(tm)); if (cs.length) return {when:"あした", cs}; }
  return null;
}
function remindHtml(){
  const s = notify.remind && soonCats();
  if (!s) return "";
  return `<div class="remind" role="status"><span class="ic" aria-hidden="true">🔔</span><div>
    <p><b>${s.when}は ${s.cs.map(c => esc(LONG[c])).join("・")} の日です</b></p>
    <small>${s.when === "きょう" ? "" : "あすの"}${cutText()}までに出してください。</small></div></div>`;
}
function updateBadge(){
  if (!canBadge) return;
  try {
    const s = notify.badge && soonCats(), n = s ? s.cs.length : 0;
    (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {});
  } catch(e){}
}
setInterval(updateBadge, 60000);

// ---- 知らせる日（ストアのアプリ）----
const hasDay = k => calState.area && notify.days.some(x => x.a === areaKey(calState.area) && x.k === k);
// これから知らせる日（地区が消えたもの・知らせる時刻を過ぎたものは除く）
function upcoming(){
  const t0 = new Date();
  return notify.days.map(x => ({...x, area: calState.areas.find(a => areaKey(a) === x.a)}))
    .filter(x => x.area && CITIES[x.area.c] && (CITIES[x.area.c].cal.schedules[x.area.s].days[x.k] || []).length && notifyAt(x.area, x.k) > t0)
    .sort((x, y) => notifyAt(x.area, x.k) - notifyAt(y.area, y.k));
}
async function scheduleNative(){
  if (!LN) return;
  try {
    await Promise.all([...new Set(notify.days.map(x => x.a.split(":")[0]))].filter(c => MUNI[c]).map(c => loadCity(c).catch(() => {})));
    const pend = await LN.getPending();
    if (pend.notifications.length) await LN.cancel({notifications: pend.notifications.map(n => ({id: n.id}))});
    const list = upcoming();
    // 過ぎたものは一覧から外す
    if (list.length !== notify.days.length){ notify.days = list.map(x => ({a: x.a, k: x.k})); saveNotify(); }
    if (!list.length) return;
    await LN.schedule({notifications: list.slice(0, 60).map((x, i) => {
      const cy = CITIES[x.area.c], at = notifyAt(x.area, x.k), c = cutOfArea(x.area);
      const names = (cy.cal.schedules[x.area.s].days[x.k] || []).slice().sort((p, q) => cy.calOrder.indexOf(p) - cy.calOrder.indexOf(q)).map(n => cy.long[n]).join("・");
      const eve = notify.time < 0;
      return {id: i + 1, title: `${eve ? "あした" : "きょう"}は ${names} の日`,
        body: `${eve ? "あすの" : ""}朝${c[0]}時${c[1] === 30 ? "半" : c[1] ? c[1] + "分" : ""}までに出してください（${x.area.n}）`,
        // Android：ぴったりの時刻の「アラーム」の許可（ストアの審査で使い道を聞かれる）は使わない。数分ずれることがある
        schedule: {at, allowWhileIdle: true}, isExactNotification: false};
    })});
  } catch(e){ console.warn("通知の予約に失敗", e); }
}
async function canNotify(){
  try {
    let p = await LN.checkPermissions();
    if (p.display !== "granted") p = await LN.requestPermissions();
    return p.display === "granted";
  } catch(e){ return false; }
}
async function addDay(k){
  if (!(await canNotify())) return false;
  notify.days.push({a: areaKey(calState.area), k}); saveNotify();
  await scheduleNative();
  return true;
}
async function removeDay(a, k){
  notify.days = notify.days.filter(x => !(x.a === a && x.k === k)); saveNotify();
  await scheduleNative();
}

// ---- ブラウザ版：その日を、通知つきでスマホのカレンダーに入れるファイル（.ics）----
const icsEsc = s => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
// 1行は75バイトまで（長い行は、文字の途中で切らないように折り返す）
function icsFold(line){
  const enc = new TextEncoder();
  let out = "", n = 0;
  for (const ch of line){
    const b = enc.encode(ch).length;
    if (n + b > 75){ out += "\r\n "; n = 1; }
    out += ch; n += b;
  }
  return out;
}
const icsDur = m => { const v = Math.abs(m), h = Math.floor(v / 60), mm = v % 60; return `${m < 0 ? "-" : ""}PT${h ? h + "H" : ""}${mm || !h ? mm + "M" : ""}`; };
function icsText(a, k){
  const cy = CITIES[a.c], d = new Date(+k.slice(0,4), +k.slice(5,7)-1, +k.slice(8,10)), c = cutOfArea(a);
  const cs = (cy.cal.schedules[a.s].days[k] || []).slice().sort((p, q) => cy.calOrder.indexOf(p) - cy.calOrder.indexOf(q));
  const names = cs.map(x => cy.long[x]).join("・"), cut = `朝${c[0]}時${c[1] === 30 ? "半" : c[1] ? c[1] + "分" : ""}`;
  const at = notifyAt(a, k), trig = Math.round((at - d) / 60000);
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//gomi-navi//gomiappV3.1//JA", "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
    "BEGIN:VEVENT", `UID:${a.c}-${a.s}-${k.replace(/-/g, "")}@gomi-navi`, "DTSTAMP:" + stamp,
    "DTSTART;VALUE=DATE:" + k.replace(/-/g, ""), "DTEND;VALUE=DATE:" + ymd(addDays(d, 1)).replace(/-/g, ""),
    "SUMMARY:" + icsEsc(`🗑 ${names}`),
    "DESCRIPTION:" + icsEsc(`${cut}までに決められた場所へ出してください。\n` + cs.map(x => `・${cy.long[x]}：${cy.bag[x]}`).join("\n")
      + `\n\n${a.n}（${areaSub(a)}）\nごみ出しカレンダー（非公式）で作りました。最新の情報は市のカレンダーやホームページで確かめてください。`),
    "TRANSP:TRANSPARENT",
    "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(`${trig < 0 ? "あした" : "きょう"}は${names}の日`), "TRIGGER:" + icsDur(trig), "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"];
  return L.map(icsFold).join("\r\n") + "\r\n";
}
function saveIcs(k){
  const a = calState.area;
  const url = URL.createObjectURL(new Blob([icsText(a, k)], {type:"text/calendar;charset=utf-8"}));
  const link = document.createElement("a");
  link.href = url; link.download = `ごみ出し_${k}.ics`;
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

// ---- 日にちの画面の「🔔 この日を知らせる」----
function quickHtml(k){
  const a = calState.area;
  if (!a || !(sched().days[k] || []).length) return "";
  const at = notifyAt(a, k), past = at <= new Date();
  let body;
  if (NATIVE && hasDay(k)) body = `<p class="nf-state">🔔 ${esc(atLabel(at))}に知らせます</p><button class="btn sub" data-nfoff="${k}">知らせるのをやめる</button>`;
  else if (past) body = `<p class="small">知らせる時刻（${esc(atLabel(at))}）を過ぎています。</p>`;
  else body = `<button class="btn" data-quick="${k}">🔔 この日を知らせる<small>${esc(atLabel(at))}に、1回だけ${NATIVE ? "" : "（スマホのカレンダーに入れます）"}</small></button>
    <p class="small" id="nfQuickMsg"></p>`;
  return `<div class="sec nf-quick" id="nfQuick">${body}<button class="more" data-notify-open>時刻を変える →</button></div>`;
}
async function quickNotify(k){
  const msg = () => $("#nfQuickMsg");
  if (NATIVE){
    if (await addDay(k)){ renderCal(); openDay(k); }
    else if (msg()) msg().textContent = "通知が許可されていません。スマホの「設定」で、このアプリの通知を許可してください。";
  } else {
    saveIcs(k);
    if (msg()) msg().innerHTML = "<b>ファイルを作りました。</b>出てきた画面で「追加」を押すと完了です（iPhone は「カレンダーに追加」、Android はカレンダーのアプリで開く）。";
  }
}

function notifyStatus(){
  if (NATIVE){
    const u = upcoming();
    if (u.length){
      const x = u[0], cy = CITIES[x.area.c];
      return `つぎ：${atLabel(notifyAt(x.area, x.k))}（${(cy.cal.schedules[x.area.s].days[x.k] || []).map(c => cy.long[c]).join("・")}）${u.length > 1 ? `ほか${u.length - 1}件` : ""}`;
    }
  }
  return `日にちを長押しすると、その日を${timeLabel(notify.time)}に知らせます`;
}
function nfListHtml(){
  const u = upcoming();
  return u.length ? `<ul class="nf-list">${u.map(x => {
    const cy = CITIES[x.area.c], names = (cy.cal.schedules[x.area.s].days[x.k] || []).map(c => cy.long[c]).join("・");
    return `<li><span><b>${esc(atLabel(notifyAt(x.area, x.k)))}</b><small>${esc(names)}${calState.areas.length > 1 ? `（${esc(x.area.n)}）` : ""}</small></span><button class="del" data-nfdel="${esc(x.a)}|${x.k}" aria-label="やめる">✕</button></li>`;
  }).join("")}</ul>` : `<p class="small">まだありません。カレンダーの日にちを長押しして「🔔 この日を知らせる」を押してください。</p>`;
}
function openNotify(){
  const a = calState.area;
  if (!a || !CAL) return;
  const steps = timeSteps(a);
  let i = steps.indexOf(notify.time);
  if (i < 0) i = steps.reduce((b, m, j) => Math.abs(m - notify.time) < Math.abs(steps[b] - notify.time) ? j : b, 0);
  const sh = $("#sheet");
  sh.innerHTML = `<div class="grab"></div>
    <div class="sh-top"><h2 id="shTitle">通知の設定</h2><button class="x" data-close aria-label="閉じる">✕</button></div>
    <div class="sec nf">
      <p>カレンダーの日にちを長押し（タップでも）して「🔔 この日を知らせる」を押すと、その日だけ1回知らせます。${NATIVE ? "" : "スマホのカレンダーに、通知つきで入れます。"}</p>
      <h3>知らせる時刻</h3>
      <p class="nf-time" id="nfTime">${esc(timeLabel(steps[i]))}</p>
      <input type="range" class="nf-range" data-nf="time" min="0" max="${steps.length - 1}" step="1" value="${i}" aria-label="知らせる時刻">
      <div class="nf-scale"><span>前の日の夕方</span><span>夜</span><span>当日の朝</span></div>
      ${NATIVE ? `<h3>知らせる日</h3><div id="nfList">${nfListHtml()}</div>` : ""}
      <h3>アプリを開いたとき</h3>
      <label class="row"><input type="checkbox" data-nf="remind"${notify.remind ? " checked" : ""}><span>「あしたは○○の日です」をいちばん上に出す</span></label>
      ${canBadge ? `<label class="row"><input type="checkbox" data-nf="badge"${notify.badge ? " checked" : ""}><span>ホーム画面のアイコンに数字の印を付ける
        <small>きょう（出す時刻の前）か、あしたに出すごみの数を出します。印はアプリを開いたときに変わります。${isIOS ? "iPhone は、ホーム画面に追加したアプリで「通知を許可」すると使えます。" : ""}</small></span></label>
      <p class="small" id="nfBadgeMsg" style="margin:0"></p>` : ""}
    </div>`;
  $("#scrim").classList.add("open"); sh.classList.add("open");
  sh.scrollTop = 0;
}
async function onNfChange(el, live){
  const k = el.dataset.nf;
  if (k === "time"){
    const steps = timeSteps(calState.area), m = steps[+el.value];
    $("#nfTime").textContent = timeLabel(m);
    if (live) return;   // 動かしている間は、文字だけ変える
    notify.time = m; saveNotify();
    await scheduleNative();
    const l = $("#nfList"); if (l) l.innerHTML = nfListHtml();
    renderCal();
    return;
  }
  if (k === "remind") notify.remind = el.checked;
  else if (k === "badge") notify.badge = el.checked;
  saveNotify(); renderCal();
  if (k === "badge" && el.checked && isIOS && "Notification" in window){
    // iPhone は、通知を許可しないとアイコンの印が出ない
    if (Notification.permission === "default"){ try { await Notification.requestPermission(); } catch(e){} }
    const msg = $("#nfBadgeMsg");
    if (msg) msg.textContent = Notification.permission === "denied" ? "通知が許可されていないので、印が出ません。iPhone の「設定」→「通知」で、このアプリの通知を許可してください。" : "";
    updateBadge();
  }
}

/* ===== カメラで調べる（スマホの中だけで判定） =====
   画像認識は Google の MobileNet v2（ImageNet の1000種類の物体）を TensorFlow.js で動かす。
   写真は端末の外に送らない。AI が答えた物体名（英語）を、下の表で品目検索のことばに置きかえ、
   区分はアプリの品目データ（市の早見表）から出す。 */
const FOOD = "生ごみ（食べ物）|生ごみ";
const CLOTH = "衣類|服";
const BALL = "ボール|ボール";

const cam = {model:null, loading:null, url:null};
function loadScript(src){
  return new Promise((ok, ng) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => ng(new Error(src));
    document.head.appendChild(s);
  });
}
function loadModel(){
  if (!cam.loading){
    cam.loading = (async () => {
      if (!window.tf) await loadScript("ai/tf.min.js");
      if (!window.mobilenet) await loadScript("ai/mobilenet.min.js");
      cam.model = await mobilenet.load({version:2, alpha:1.0, modelUrl:"ai/model/model.json"});
      return cam.model;
    })().catch(e => { cam.loading = null; throw e; });
  }
  return cam.loading;
}
// 写真の中央を正方形に切り出して 224px にする（大きな写真のままだと重いため）
function squareCanvas(img){
  const s = Math.min(img.naturalWidth, img.naturalHeight), cv = document.createElement("canvas");
  cv.width = cv.height = 224;
  cv.getContext("2d").drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, 224, 224);
  return cv;
}
// 品目検索と同じ並び順で、ことばに合う品目を返す（「コップ」で「スコップ」が出ないよう、名前の頭が合うものだけ）
function findItems(q){
  const keep = [state.q, state.cat], qn = normChar(q);
  state.q = q; state.cat = null;
  const r = search().list.filter(it => it._n.s.startsWith(qn) || it._y.startsWith(qn) || it._parts.some(p => p.startsWith(qn)));
  [state.q, state.cat] = keep;
  return r;
}
function sureText(p){ return p >= .5 ? "可能性が高い" : p >= .2 ? "かもしれません" : "もしかすると"; }

async function runCamera(file){
  if (!file) return;
  if (cam.url) URL.revokeObjectURL(cam.url);
  cam.url = URL.createObjectURL(file);
  const sh = $("#sheet");
  sh.innerHTML = `<div class="grab"></div>
    <div class="sh-top"><h2 id="shTitle">カメラで調べる</h2><button class="x" data-close aria-label="閉じる">✕</button></div>
    <div class="cam-photo"><img id="camImg" alt="撮った写真"></div>
    <div id="camOut"><p class="cam-wait"><span class="spin"></span><span id="camMsg">見分けています…</span></p></div>`;
  sh.scrollTop = 0;
  const out = $("#camOut");
  try {
    const img = $("#camImg");
    await new Promise((ok, ng) => { img.onload = ok; img.onerror = () => ng(new Error("img")); img.src = cam.url; });
    if (!cam.model) $("#camMsg").textContent = "見分けるためのデータを読み込んでいます…（はじめてのときは少し時間がかかります）";
    const model = await loadModel();
    $("#camMsg").textContent = "見分けています…";
    const preds = await model.classify(squareCanvas(img), 10);
    renderGuesses(out, preds);
  } catch(e){
    out.innerHTML = `<div class="sec"><div class="note-box">うまく読み込めませんでした。電波のよい所で、もう一度お試しください。</div></div>
      <button class="btn" data-camagain>もう一度撮る</button>`;
  }
}

function renderGuesses(out, preds){
  const guesses = [], seen = new Set();
  for (const p of preds){
    const key = p.className.split(",")[0].trim();
    const m = AI_MAP[key];
    if (!m) continue;
    const [label, qs] = m.split("|");
    if (seen.has(label)) { guesses.find(g => g.label === label).p += p.probability; continue; }
    seen.add(label);
    guesses.push({label, qs: qs.split(","), p: p.probability});
  }
  // 自信が低すぎる見立て（10%未満）は出さない。多くても3つまで
  guesses.sort((a, b) => b.p - a.p);
  guesses.splice(0, guesses.length, ...guesses.filter(g => g.p >= 0.1).slice(0, 3));
  const again = `<button class="btn" data-camagain>もう一度撮る</button>
    <button class="btn sub" data-camtext>文字で検索する</button>`;
  if (!guesses.length){
    out.innerHTML = `<div class="sec"><div class="note-box"><b>うまく見分けられませんでした。</b><br>
      ごみを1つだけ、明るい所で大きめに撮ると見分けやすくなります。食品の容器などは「品目検索」で名前を入れて探してください。</div></div>${again}`;
    return;
  }
  let html = `<div class="sec"><h3>AIの見立て（それらしい順）</h3>
    <p class="small">素材（プラスチック・金属・紙など）や汚れ、マークは写真では分かりません。下の品目から当てはまるものを選んでください。</p></div>`;
  guesses.forEach((g, i) => {
    html += `<div class="cam-guess${i ? "" : " top"}"><b>${esc(g.label)}</b><span class="sure">${sureText(g.p)}（${Math.round(g.p * 100)}%）</span></div>`;
    const cats = g.qs.filter(q => q[0] === "@").map(q => CITY.aiCat[q.slice(1)] || q.slice(1)).filter(c => CATS[c]);
    const items = [], ids = new Set();
    for (const q of g.qs.filter(q => q[0] !== "@")){
      for (const it of findItems(q)){ if (!ids.has(it.id)){ ids.add(it.id); items.push(it); } }
    }
    if (cats.length) html += `<ul class="items cam-items">${cats.map(c => `<li><button class="item" data-filter="${esc(c)}">
      <span class="txt"><span class="nm">${esc(CATS[c].name)}の品目を見る</span></span><span class="bcol">${badge(c)}</span></button></li>`).join("")}</ul>`;
    if (items.length){
      const shown = items.slice(0, 5);
      html += `<ul class="items cam-items">${shown.map(it => itemRow(it, "")).join("")}</ul>`;
      if (items.length > shown.length) html += `<button class="more cam-more" data-camq="${esc(g.qs[0])}">「${esc(g.qs[0])}」で品目検索する →</button>`;
    }
    if (!cats.length && !items.length) html += `<p class="small cam-foot" style="padding-top:0">${esc(CITY.name)}の品目一覧には見つかりませんでした。「分別区分」タブで材質から確かめてください。</p>`;
  });
  out.innerHTML = html + again;
}

/* ===== タブ ===== */
function setTab(t){
  state.tab = t;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  $("#view-cal").hidden = t !== "cal";
  $("#view-search").hidden = t !== "search";
  $("#view-guide").hidden = t !== "guide";
  $("#view-rules").hidden = t !== "rules";
  $("#searchUI").hidden = t !== "search";
  updateHdr();
  window.scrollTo({top:0});
}
function updateHdr(){ document.documentElement.style.setProperty("--hdr", $("#hdr").offsetHeight + "px"); }

/* ===== イベント ===== */
let tmr;
$("#q").addEventListener("input", e => { state.q = e.target.value; clearTimeout(tmr); tmr = setTimeout(() => { render(); window.scrollTo({top:0}); }, 80); });
$("#clear").addEventListener("click", () => { $("#q").value = ""; state.q = ""; render(); $("#q").focus(); });
$("#chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  state.cat = b.dataset.cat || null; renderChips(); render(); window.scrollTo({top:0});
});
document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setTab(b.dataset.tab); });
document.addEventListener("click", e => {
  const it = e.target.closest(".item[data-id]"); if (it){ openItem(+it.dataset.id); return; }
  if (e.target.closest("#camOpen") || e.target.closest("[data-camagain]")){ openCamera(); return; }
  if (e.target.closest("[data-camtext]")){ closeSheet(); setTab("search"); $("#q").focus(); return; }
  const cq = e.target.closest("[data-camq]");
  if (cq){ closeSheet(); state.cat = null; state.q = cq.dataset.camq; $("#q").value = state.q; renderChips(); setTab("search"); render(); return; }
  if (e.target.closest("[data-close]") || e.target === $("#scrim")){ closeSheet(); return; }
  const qk = e.target.closest("[data-quick]");
  if (qk){ quickNotify(qk.dataset.quick); return; }
  const nfo = e.target.closest("[data-nfoff]");
  if (nfo){ removeDay(areaKey(calState.area), nfo.dataset.nfoff).then(() => { renderCal(); openDay(nfo.dataset.nfoff); }); return; }
  const nfd = e.target.closest("[data-nfdel]");
  if (nfd){ const [a, k] = nfd.dataset.nfdel.split("|"); removeDay(a, k).then(() => { const l = $("#nfList"); if (l) l.innerHTML = nfListHtml(); renderCal(); }); return; }
  if (e.target.closest("[data-notify-open]")){ openNotify(); return; }
  const g = e.target.closest("[data-guide]");
  if (g){ closeSheet(); setTab("guide"); const el = document.getElementById("cat-" + g.dataset.guide); if (el) window.scrollTo({top: el.offsetTop - $("#hdr").offsetHeight - 8}); return; }
  const f = e.target.closest("[data-filter]");
  if (f){ closeSheet(); state.cat = f.dataset.filter; state.q = ""; $("#q").value = ""; renderChips(); setTab("search"); render(); return; }
  if (e.target.closest("[data-gocal]")){ closeSheet(); setTab("cal"); return; }
  if (e.target.closest("[data-allcats]")){ state.cat = null; renderChips(); render(); return; }
  const j = e.target.closest("[data-jump]");
  if (j){ const el = document.getElementById("g-" + j.dataset.jump); if (el) window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - $("#hdr").offsetHeight - 4, behavior:"smooth"}); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
document.addEventListener("change", e => {
  if (e.target.matches("[data-camfile]")) runCamera(e.target.files[0]);
  if (e.target.matches("[data-nf]")) onNfChange(e.target);
});
document.addEventListener("input", e => { if (e.target.matches('[data-nf="time"]')) onNfChange(e.target, true); });
window.addEventListener("resize", updateHdr);

/* テーマ切替（端末設定 → ライト → ダーク） */
const THEMES = [null, "light", "dark"];
let themeIdx = 0;
try { const t = localStorage.getItem("gomi-theme"); if (t) { themeIdx = THEMES.indexOf(t); document.documentElement.dataset.theme = t; } } catch(e){}
$("#themeBtn").addEventListener("click", () => {
  themeIdx = (themeIdx + 1) % THEMES.length;
  const t = THEMES[themeIdx];
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  try { t ? localStorage.setItem("gomi-theme", t) : localStorage.removeItem("gomi-theme"); } catch(e){}
});

async function start(){
  const need = [...new Set([calState.city, ...calState.areas.map(a => a.c)])].filter(c => MUNI[c]);
  if (!need.length) need.push(DEFAULT_CITY);
  $("#view-cal").innerHTML = `<p class="geo-wait" style="padding:20px 0"><span class="spin"></span>読み込んでいます…</p>`;
  setTab("cal");
  await Promise.allSettled(need.map(loadCity));
  if (need.some(c => !CITIES[c])){
    $("#view-cal").innerHTML = `<div class="empty">データを読み込めませんでした。電波のよい所で、開き直してください。<br><button class="btn-sub" onclick="location.reload()" style="margin-top:10px">開き直す</button></div>`;
    return;
  }
  // 収集日データにない地区（日程の名前が変わったなど）は外す
  calState.areas = calState.areas.filter(a => CITIES[a.c].cal.schedules[a.s]);
  calState.cur = Math.min(calState.cur, Math.max(calState.areas.length - 1, 0));
  saveAreas();
  if (calState.area) calState.city = calState.area.c;
  if (!CITIES[calState.city]) calState.city = need.find(c => CITIES[c]);
  calState.region = (calState.area && calState.area.r) || CITIES[calState.city].regions[0] || "";
  renderCal(); setTab("cal");
  if (NATIVE){
    // ストアのアプリ：通知を予約し直す（先の分を足す）。自治体の一覧・祝日は新しいものを取ってきて、次に開いたときから使う
    scheduleNative().then(() => renderCal());
    ["data/municipalities.js", "data/holidays.js"].forEach(p => dataText(p).catch(() => {}));
  }
}
start();
// 日付が変わったら（アプリを開きっぱなしでも）表示を更新
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if (state.tab === "cal" && !calState.picking) renderCal();
  if (NATIVE) scheduleNative();
});

/* オフライン対応（Web サーバー上で開いたときのみ有効。ストアのアプリは中にデータが入っているので使わない） */
if ("serviceWorker" in navigator && location.protocol.startsWith("http") && !NATIVE){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  // 初めて開いたとき（オフライン用のしくみが動く前）に読んだ自治体のデータも、オフライン用に保存しておく
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    Object.keys(CITIES).forEach(code => ["city", "items", "calendar"].forEach(k => fetch(`data/${MUNI[code].path}/${k}.js`).catch(() => {})));
  });
}
</script>
